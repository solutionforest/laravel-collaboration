name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs on our self-hosted runners. To change their labels without
# editing this file, set the repository variable CI_RUNNER_LABELS to a JSON
# array, e.g. ["self-hosted","linux","ephemeral"].

jobs:
  php:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Pest
        run: vendor/bin/pest

      - name: Code style
        if: matrix.php == '8.4' && matrix.laravel == '13'
        run: vendor/bin/pint --test

  javascript:
    name: JavaScript · lint, tests, build
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: The Livewire script is built from the sources
        run: npm run build && git diff --exit-code -- resources/dist

  browsers:
    name: Browsers · Livewire, React and Vue together
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env && php artisan key:generate --no-interaction
      - run: touch database/database.sqlite && php artisan migrate --seed --no-interaction
      - run: npm run build

      - name: Three people, three stacks, one article
        run: |
          php artisan serve --port=8123 > storage/logs/serve.log 2>&1 &
          sleep 3
          node tests/browser/smoke.mjs

  filament:
    name: Filament Collaboration on this core
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux"]') }}
    timeout-minutes: 25
    # The branch of filament-collaboration that builds on this package. Set the
    # repository variable FILAMENT_COLLABORATION_REF to `main` once it is merged.
    env:
      FILAMENT_REF: ${{ vars.FILAMENT_COLLABORATION_REF || 'refactor/use-laravel-collaboration-core' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: core

      - uses: actions/checkout@v4
        with:
          repository: solutionforest/filament-collaboration
          ref: ${{ env.FILAMENT_REF }}
          path: filament

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - name: Install the demo with this checkout of the core
        working-directory: filament/demo
        run: |
          php -r '
              $file = "composer.json";
              $json = json_decode(file_get_contents($file), true);
              $json["repositories"] = array_values(array_filter($json["repositories"], fn ($r) => ! str_contains($r["url"], "laravel-collaboration")));
              array_unshift($json["repositories"], ["type" => "path", "url" => "../../core", "options" => ["symlink" => true, "versions" => ["solutionforest/laravel-collaboration" => "0.1.0"]]]);
              $json["require"]["solutionforest/laravel-collaboration"] = "0.1.0";
              file_put_contents($file, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          '
          composer update solutionforest/laravel-collaboration solutionforest/filament-collaboration --with-dependencies --no-interaction --no-progress
          cp .env.example .env && php artisan key:generate --no-interaction

      - name: Pest
        working-directory: filament/demo
        run: vendor/bin/pest

      - name: PHPStan, level 10
        working-directory: filament/demo
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
